[project]
name = "openrlbenchmark"
version = "0.3.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Costa Huang", email = "costa.huang@outlook.com" },
]
dependencies = [
    "wandb>=0.18.7,<1.0",
    "rliable>=1.2.0,<2.0.0",
    "peewee>=4.0.1,<5.0.0",
    "dotmap>=1.3.30,<2.0.0",
    "tyro>=0.9.1,<0.10.0",
    "tqdm>=4.67.3,<5.0.0",
    "rich>=13.8.1,<14.0.0",
    "tabulate>=0.9.0,<0.10.0",
    "seaborn>=0.12.2,<1.0",
    "importlib-metadata>=6.7.0,<7.0.0",
    "tueplots>=0.0.9,<0.1",
    "multiprocess>=0.70.15,<0.71.0",
    "expt>=0.4.2,<0.5.0",
]

[dependency-groups]
dev = [
    "notebook>=6.5.7,<7.0.0",
    "pre-commit>=2.21.0,<3.0.0",
    "pytest>=7.4.4,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrlbenchmark"]

[tool.uv]
add-bounds = "major"

[tool.ruff]
line-length = 127
target-version = "py310"
# exclude = ["wandb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (includes unused imports/variables)
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "RUF",
]

# [tool.ruff.lint.isort]
# known-third-party = ["wandb"]

[tool.ruff.lint.per-file-ignores]
# Line-length
"./tests/*.py" = ["E501"]
