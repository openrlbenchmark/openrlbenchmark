name: tests
on:
  pull_request:
    paths-ignore:
      - '**/README.md'
      - 'static/**/*'
jobs:
  test-core-envs:
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.12]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use uv for faster downloads
          pip install uv
          uv sync
      - name: login to wandb
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: uv run wandb login $WANDB_API_KEY
      - name: Run core tests
        run: uv run pytest tests/test_e2e_ci.py
